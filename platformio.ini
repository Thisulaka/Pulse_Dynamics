[env:posture_monitor]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    fastled/FastLED@^3.9.0
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2