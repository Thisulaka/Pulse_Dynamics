; Smart Posture Trainer - PlatformIO project for the ESP32-C3 Mini
; Open this folder in VS Code (PlatformIO extension), then Upload and Monitor.

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Serial Monitor speed (matches Serial.begin(115200) in the code)
monitor_speed = 115200

; ESP32-C3 Mini uses its built-in USB for Serial - these two lines make Serial work
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Libraries - PlatformIO downloads them automatically on the first build
lib_deps =
  links2004/WebSockets
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
